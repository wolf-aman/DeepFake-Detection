[project]
name = "speaker-deepfake-demo"
version = "0.1.0"
description = "FastAPI demo for speaker enrollment, speaker verification, and audio deepfake detection."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "jinja2>=3.1.4",
    "numpy<2.0",
    "python-multipart>=0.0.9",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "speechbrain==1.0.3",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "transformers==4.46.3",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
